  <script>/* Shared accounting rules. All monetary values are integer paise. */
const Ledger = (() => {
  const categories = ['Product Purchase', 'Salary', 'EB Bill', 'Rent', 'Petrol', 'Others'];
  const empty = () => ({ schema: 1, contacts: [], entries: [] });
  function assert(ok, message) { if (!ok) throw new Error(message); }
  function money(value) {
    const text = String(value).trim();
    assert(/^\d+(\.\d{1,2})?$/.test(text), 'ENTER A VALID AMOUNT');
    const [whole, fraction = ''] = text.split('.');
    const result = Number(whole) * 100 + Number(fraction.padEnd(2, '0'));
    assert(Number.isSafeInteger(result) && result <= 100000000000, 'AMOUNT TOO LARGE');
    return result;
  }
  function amount(n) { return Number.isSafeInteger(n) && n >= 0 && n <= 100000000000; }
  function dateValid(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && Number.isFinite(Date.parse(s)) && new Date(s).toISOString().slice(0, 10) === s; }
  function balances(state) {
    const result = Object.fromEntries(state.contacts.map(c => [c.id, c.openingBalance]));
    for (const e of state.entries) {
      if (e.type === 'sales') for (const c of e.credits) result[c.contactId] += c.amount;
      if (e.type === 'collection') result[e.contactId] -= e.amount;
      if (e.type === 'purchase') result[e.contactId] += e.amount;
      if (e.type === 'expense' && e.supplierId) result[e.supplierId] -= e.amount;
    }
    return result;
  }
  function totals(state, day) {
    const t = { cash: 0, upi: 0, bank: 0, sales: 0, expenses: 0, credit: 0, collections: 0, net: 0 };
    for (const e of state.entries.filter(e => !day || e.date === day)) {
      if (e.type === 'sales') { const credit = e.credits.reduce((s,c) => s + c.amount, 0); t.cash += e.cash; t.upi += e.upi; t.credit += credit; t.sales += e.cash + e.upi + credit; }
      if (e.type === 'expense') { t[e.channel] -= e.amount; t.expenses += e.amount; }
      if (e.type === 'collection') { t[e.channel] += e.amount; t.collections += e.amount; }
      if (e.type === 'deposit') { t.cash -= e.amount; t.bank += e.amount; }
    }
    t.net = t.cash + t.upi + t.bank;
    return t;
  }
  function validate(s) {
    assert(s && s.schema === 1 && Array.isArray(s.contacts) && Array.isArray(s.entries), 'INVALID LEDGER');
    assert(s.contacts.length <= 5000 && s.entries.length <= 20000, 'LEDGER LIMIT REACHED');
    const ids = new Set();
    function id(x) { assert(typeof x === 'string' && /^[a-zA-Z0-9_-]{6,80}$/.test(x) && !ids.has(x), 'INVALID OR DUPLICATE ID'); ids.add(x); }
    const contacts = new Map();
    for (const c of s.contacts) {
      id(c.id); assert(['supplier','employee','customer'].includes(c.type), 'INVALID CONTACT TYPE');
      assert(typeof c.name === 'string' && c.name.trim().length > 0 && c.name.length <= 100, 'ENTER A NAME');
      assert(typeof c.phone === 'string' && /^[+\d ()-]{0,24}$/.test(c.phone), 'INVALID PHONE');
      assert(amount(c.openingBalance) && amount(c.salary), 'INVALID CONTACT AMOUNT');
      assert(c.type === 'employee' ? c.openingBalance === 0 : c.salary === 0, 'INVALID CONTACT BALANCE');
      contacts.set(c.id, c);
    }
    const ref = (id, type) => assert(contacts.get(id)?.type === type, 'CONTACT NOT FOUND');
    for (const e of s.entries) {
      id(e.id); assert(dateValid(e.date), 'INVALID DATE');
      assert(typeof e.note === 'string' && e.note.length <= 160, 'NOTE TOO LONG');
      assert(['sales','expense','collection','purchase','deposit'].includes(e.type), 'INVALID ENTRY TYPE');
      if (e.type === 'sales') {
        assert(amount(e.cash) && amount(e.upi) && Array.isArray(e.credits), 'INVALID SALES');
        const used = new Set();
        for (const c of e.credits) { ref(c.contactId, 'customer'); assert(!used.has(c.contactId) && amount(c.amount) && c.amount > 0, 'INVALID CREDIT'); used.add(c.contactId); }
        assert(e.cash + e.upi + e.credits.reduce((s,c) => s + c.amount,0) > 0, 'ENTER A SALES AMOUNT');
      } else {
        assert(amount(e.amount) && e.amount > 0, 'ENTER AN AMOUNT');
        if (e.type !== 'purchase') assert(['cash','upi'].includes(e.channel), 'INVALID PAYMENT CHANNEL');
        if (e.type === 'expense') { assert(categories.includes(e.category), 'INVALID CATEGORY'); assert(typeof e.supplierId === 'string', 'INVALID SUPPLIER'); if (e.supplierId) { assert(e.category === 'Product Purchase', 'INVALID SUPPLIER PAYMENT'); ref(e.supplierId,'supplier'); } }
        if (e.type === 'collection') ref(e.contactId,'customer');
        if (e.type === 'purchase') ref(e.contactId,'supplier');
        if (e.type === 'deposit') {
          assert(e.channel === 'cash', 'DEPOSIT MUST USE CASH');
          assert(typeof e.bankName === 'string' && e.bankName.trim().length > 0 && e.bankName.length <= 100, 'ENTER BANK OR ACCOUNT NAME');
          assert(typeof e.reference === 'string' && e.reference.length <= 80, 'INVALID DEPOSIT REFERENCE');
        }
      }
    }
    assert(Object.values(balances(s)).every(n => Number.isSafeInteger(n) && n >= 0), 'PAYMENT EXCEEDS OUTSTANDING BALANCE');
    assert(Object.values(totals(s)).every(Number.isSafeInteger), 'LEDGER TOTAL TOO LARGE');
    // Dates are daily aggregates: all cash activity on a date funds that day's deposits.
    const days = new Map();
    for (const e of s.entries) {
      if(!days.has(e.date))days.set(e.date,{cash:0,deposit:false});
      const day=days.get(e.date);
      if(e.type==='sales')day.cash+=e.cash;
      if(e.type==='collection' && e.channel==='cash')day.cash+=e.amount;
      if(e.type==='expense' && e.channel==='cash')day.cash-=e.amount;
      if(e.type==='deposit'){day.cash-=e.amount;day.deposit=true;}
    }
    let cash=0;
    for(const date of [...days.keys()].sort()) {
      const day=days.get(date);cash+=day.cash;
      assert(!day.deposit || cash>=0,'DEPOSIT EXCEEDS CASH AVAILABLE ON ITS DATE');
    }
    return s;
  }
  function transition(before, after) {
    validate(after);
    let changes = 0;
    for (const key of ['contacts','entries']) {
      const old = new Map(before[key].map(x => [x.id,x]));
      for (const item of after[key]) {
        if (!old.has(item.id)) changes++;
        else if (JSON.stringify(old.get(item.id)) !== JSON.stringify(item)) { assert(key === 'contacts' && old.get(item.id).type === item.type, 'ENTRIES ARE IMMUTABLE'); changes++; }
        old.delete(item.id);
      }
      changes += old.size;
    }
    assert(changes === 1, 'SAVE ONE CHANGE AT A TIME');
    return after;
  }
  return { categories, empty, money, balances, totals, validate, transition };
})();
if (typeof module !== 'undefined') module.exports = Ledger;
</script>
  <script>/* Calendar arithmetic uses UTC for date-only values; business today is supplied by the UI. */

    if(b.dataset.contactPay){const c=state.contacts.find(c=>c.id===b.dataset.contactPay);entryForm(c.type==='supplier'?'expense':'collection',c.id);}
  });
  function exportCsv() {
    const error=Reports.rangeError(ledgerFrom,ledgerTo);if(error){toast(error,true);return;}
    const rows=[['Date','Type','Cash INR','UPI INR','Credit INR','Amount INR','Channel','Contact','Note','Bank / Account','Deposit Reference'],...filteredEntries().map(e=>[e.date,entryTitle(e),e.type==='sales'?decimal(e.cash):e.type==='deposit'?decimal(-e.amount):'',e.type==='sales'?decimal(e.upi):'',e.type==='sales'?decimal(e.credits.reduce((s,c)=>s+c.amount,0)):'',decimal(entryAmount(e)),entryChannel(e),state.contacts.find(c=>c.id===(e.contactId||e.supplierId))?.name||'',e.note,e.bankName||'',e.reference||''])];
    const csv='\uFEFF'+rows.map(row=>row.map(value=>{let text=String(value);if(/^[=+@\-\t\r]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"';}).join(',')).join('\r\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`daily-ledger-${today()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
